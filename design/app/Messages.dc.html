<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>消息</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F1F4F6; color: #15171C; font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', sans-serif">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 50px 16px 0 20px">
<h1 style="margin: 0; font-size: 28px; line-height: 1.2; font-weight: 800; letter-spacing: -0.01em">消息</h1>
<div aria-hidden="true" style="flex-shrink: 0; display: flex; align-items: center; width: 87px; height: 32px; box-sizing: border-box; border: 1px solid #E2E7EB; border-radius: 999px; background: #FFFFFF"><span style="flex: 1; display: flex; justify-content: center; gap: 3px"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span><span style="width: 1px; height: 18px; background: #E2E7EB"></span><span style="flex: 1; display: flex; justify-content: center"><span style="width: 15px; height: 15px; box-sizing: border-box; border: 2px solid #15171C; border-radius: 999px; display: flex; align-items: center; justify-content: center"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span></span></div>
</div>
<div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px">
<div style="padding: 0 4px; font-size: 13px; font-weight: 700; color: #5B5F68">需要你处理</div>
<div style="padding: 16px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 999px; background: {{accent}}; color: #15171C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">周六 05:50 · 苍山看日出</span><span style="font-size: 13px; color: #5B5F68">还去吗？提前说不算鸽，确认一下大家心里有数</span></div>
</div>
<sc-if value="{{pending}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{yes}}" style="flex: 1; height: 44px; border-radius: 999px; border: 0; background: #193543; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">确认出席</button>
<button type="button" onClick="{{no}}" style="flex: 1; height: 44px; box-sizing: border-box; border-radius: 999px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">去不了了</button>
</div>
</sc-if>
<sc-if value="{{isYes}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; font-weight: 700; color: #193543"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"></path></svg><span>已确认出席，周六见</span></div>
</sc-if>
<sc-if value="{{isNo}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; min-height: 44px; font-size: 13px; line-height: 1.5; color: #3D4048">已帮你退出，名额让给了候补。提前说的，不算鸽。</div>
</sc-if>
</div>
<a href="Review.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 12px 14px 16px; border-radius: 24px; background: #FFFFFF; color: #15171C; text-decoration: none">
<span aria-hidden="true" style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 999px; background: #193543; color: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l2.4 5 5.4.6-4 3.7 1.1 5.3L12 15.9 7.1 18.6l1.1-5.3-4-3.7 5.4-.6z"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">「桌游夜」结束啦</span><span style="font-size: 13px; color: #5B5F68">给同行的人一个评价 · 匿名</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#858C94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg>
</a>
<div style="padding: 0 4px; font-size: 13px; font-weight: 700; color: #5B5F68">局聊</div>
<div style="padding: 4px 0; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column">
<a href="Group.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 0 16px; color: #15171C; text-decoration: none">
<span aria-hidden="true" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; background: #193543; color: {{accent}}; display: flex; align-items: flex-end; overflow: hidden"><svg width="44" height="30" viewBox="0 0 44 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="31" cy="10" r="4"></circle><path d="M0 29l10-10 7 5 9-10 8 10 10 5"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 700">苍山看日出 · 5 人</span><span style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; color: #5B5F68">阿野：我带了几个暖宝宝，山上清晨挺冷的</span></span>
<span style="flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px"><span style="font-size: 12px; color: #5B5F68">10:32</span><span style="min-width: 20px; padding: 1px 6px; box-sizing: border-box; border-radius: 999px; background: {{accent}}; color: #15171C; font-size: 11px; font-weight: 800; text-align: center">3</span></span>
</a>
<a href="Group.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 0 16px; color: #15171C; text-decoration: none">
<span aria-hidden="true" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; background: #2E4A5C; color: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"></rect><circle cx="9" cy="9" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="15" cy="15" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"></circle></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 700">桌游夜 · 新手友好</span><span style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; color: #5B5F68">木木：下次还来！</span></span>
<span style="flex-shrink: 0; font-size: 12px; color: #5B5F68">昨天</span>
</a>
</div>
<div style="padding: 0 4px; font-size: 13px; font-weight: 700; color: #5B5F68">通知</div>
<div style="padding: 4px 0; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column">
<a href="Matching.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 12px 0 16px; color: #15171C; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#193543" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3.5l1.9 5 5 1.9-5 1.9-1.9 5-1.9-5-5-1.9 5-1.9z"></path></svg><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">撮合成功：周六清晨一起看日出</span><span style="font-size: 12px; color: #5B5F68">今天 09:12</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#858C94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg></a>
<div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B5F68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3.5l7 2.8v5.4c0 4.2-2.9 7.4-7 8.8-4.1-1.4-7-4.6-7-8.8V6.3z"></path><path d="M9 12l2 2 4-4"></path></svg><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">你的举报已处理，对方已被限制使用</span><span style="font-size: 12px; color: #5B5F68">昨天</span></span></div>
</div>
</div>

<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 48px; color: #6B6F78; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"></circle><path d="M3.5 19c.6-3.1 2.8-5 5.5-5s4.9 1.9 5.5 5"></path><circle cx="17" cy="9" r="2.6"></circle><path d="M15.8 14.2c2.3.2 4 1.9 4.6 4.8"></path></svg></span><span style="font-size: 11px; font-weight: 500">撮合</span></a>
<a href="Square.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 48px; color: #6B6F78; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg></span><span style="font-size: 11px; font-weight: 500">广场</span></a>
<a href="Feed.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 48px; color: #6B6F78; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M20.5 16l-4.5-4.5-7.5 8"></path></svg></span><span style="font-size: 11px; font-weight: 500">动态</span></a>
<a href="Messages.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 48px; color: #15171C; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 999px; background: {{accent}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-4.5 3.5z"></path></svg></span><span style="font-size: 11px; font-weight: 700">消息</span></a>
<a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 48px; color: #6B6F78; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"></circle><path d="M4.5 20c.9-3.8 3.9-6 7.5-6s6.6 2.2 7.5 6"></path></svg></span><span style="font-size: 11px; font-weight: 500">我的</span></a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7CCAE3","options":["#7CCAE3","#C4B5FD","#D2F65A","#FDBA74"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const answer = s.answer || '';
    return {
      accent: this.props.accent ?? '#7CCAE3',
      pending: !answer,
      isYes: answer === 'yes',
      isNo: answer === 'no',
      yes: () => this.setState({ answer: 'yes' }),
      no: () => this.setState({ answer: 'no' })
    };
  }
}
</script>
