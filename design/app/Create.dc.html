<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>发起一个局</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1260px; box-sizing: border-box; overflow: hidden; background: #F1F4F6; color: #15171C; font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', sans-serif">
<div style="display: flex; align-items: center; gap: 4px; padding: 50px 16px 0 4px">
<a href="Square.dc.html" aria-label="返回" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15171C; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg></a>
<h1 style="flex: 1; min-width: 0; margin: 0; font-size: 17px; font-weight: 800">发起一个局</h1>
<div aria-hidden="true" style="flex-shrink: 0; display: flex; align-items: center; width: 87px; height: 32px; box-sizing: border-box; border: 1px solid #E2E7EB; border-radius: 999px; background: #FFFFFF"><span style="flex: 1; display: flex; justify-content: center; gap: 3px"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span><span style="width: 1px; height: 18px; background: #E2E7EB"></span><span style="flex: 1; display: flex; justify-content: center"><span style="width: 15px; height: 15px; box-sizing: border-box; border: 2px solid #15171C; border-radius: 999px; display: flex; align-items: center; justify-content: center"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span></span></div>
</div>
<sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
<div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 14px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #E1E7EC; color: #15171C; font-size: 13px; line-height: 1.5; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#193543" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3.5l1.9 5 5 1.9-5 1.9-1.9 5-1.9-5-5-1.9 5-1.9z"></path></svg><span style="flex: 1">不想自己张罗？回首页说出想做的事，平台帮你凑人。</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg></a>
<div style="padding: 16px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 700; color: #5B5F68">类型</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{types}}" as="c" hint-placeholder-count="6">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: #15171C; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="ctitle" style="font-size: 13px; font-weight: 700; color: #5B5F68">标题</label>
<input id="ctitle" type="text" placeholder="比如：周六清晨 · 苍山看日出" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; font-family: inherit; font-size: 15px">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 700; color: #5B5F68">时间和地点</div>
<button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; font-family: inherit; font-size: 15px; text-align: left; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B5F68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg><span style="flex: 1">10月31日 周六 05:50</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#858C94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg></button>
<button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; font-family: inherit; font-size: 15px; text-align: left; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B5F68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.3"></circle></svg><span style="flex: 1">大理古城南门</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#858C94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg></button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">人数</span><span style="font-size: 12px; color: #5B5F68">含你自己，满员自动建群</span></div>
<div style="display: flex; align-items: center; gap: 4px">
<button type="button" aria-label="减少人数" onClick="{{dec}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span style="min-width: 36px; text-align: center; font-size: 18px; font-weight: 800">{{size}}</span>
<button type="button" aria-label="增加人数" onClick="{{inc}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 700; color: #5B5F68">费用</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{fees}}" as="c" hint-placeholder-count="3">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: #15171C; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
<sc-if value="{{isAA}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 8px; padding-top: 2px">
<label for="per" style="font-size: 14px; color: #3D4048">预计每人（元）</label>
<input id="per" type="number" placeholder="30" style="width: 96px; height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; font-family: inherit; font-size: 15px">
<span style="font-size: 12px; color: #5B5F68">只记账，平台不收钱</span>
</div>
</sc-if>
</div>
</div>
<div style="padding: 4px 8px 4px 16px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 12px; min-height: 64px">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">报名需要我同意</span><span style="font-size: 12px; color: #5B5F68">适合想先看看是谁的你</span></span>
<button type="button" role="switch" aria-checked="{{ap.checked}}" aria-label="报名需要我同意" onClick="{{toggleApprove}}" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 56px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer"><span style="display: flex; justify-content: {{ap.justify}}; width: 52px; height: 32px; box-sizing: border-box; padding: 3px; border-radius: 999px; background: {{ap.track}}"><span style="width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(21, 23, 28, 0.25)"></span></span></button>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 64px; border-top: 1px solid #E8ECEF">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">只限同性</span><span style="font-size: 12px; color: #5B5F68">只有同性别的人能看到和报名</span></span>
<button type="button" role="switch" aria-checked="{{sm.checked}}" aria-label="只限同性" onClick="{{toggleSame}}" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 56px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer"><span style="display: flex; justify-content: {{sm.justify}}; width: 52px; height: 32px; box-sizing: border-box; padding: 3px; border-radius: 999px; background: {{sm.track}}"><span style="width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(21, 23, 28, 0.25)"></span></span></button>
</div>
</div>
<div style="padding: 16px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
<label for="desc" style="font-size: 13px; font-weight: 700; color: #5B5F68">说两句（选填）</label>
<textarea id="desc" placeholder="比如：慢热友好，不用尬聊，到点出现就好" style="height: 88px; box-sizing: border-box; padding: 12px 14px; border-radius: 14px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; font-family: inherit; font-size: 15px; line-height: 1.5; resize: none"></textarea>
</div>
<div style="display: flex; align-items: flex-start; gap: 6px; padding: 0 4px; font-size: 12px; line-height: 1.5; color: #5B5F68"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M12 3.5l7 2.8v5.4c0 4.2-2.9 7.4-7 8.8-4.1-1.4-7-4.6-7-8.8V6.3z"></path><path d="M9 12l2 2 4-4"></path></svg><span>发布前会自动审核：含联系方式、广告、约会擦边的内容会被拦截。</span></div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 20px 30px; background: #FFFFFF; border-top: 1px solid #E2E7EB">
<button type="button" onClick="{{publish}}" style="width: 100%; height: 56px; border-radius: 999px; border: 0; background: #193543; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">发布</button>
</div>
</sc-if>
<sc-if value="{{published}}" hint-placeholder-val="{{ false }}">
<div style="padding: 120px 32px 0; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 999px; background: {{accent}}; color: #15171C; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"></path></svg></span>
<div style="font-size: 22px; font-weight: 800">发布成功</div>
<div style="font-size: 15px; line-height: 1.6; color: #3D4048">审核通过后，大家就能在广场看到。满员会自动建群，并提醒你。</div>
<div style="display: flex; flex-direction: column; gap: 10px; width: 100%; padding-top: 12px">
<a href="MyEvents.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #193543; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">看看我的局</a>
<a href="Square.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; box-sizing: border-box; border-radius: 999px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; font-size: 15px; font-weight: 700; text-decoration: none">回到广场</a>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7CCAE3","options":["#7CCAE3","#C4B5FD","#D2F65A","#FDBA74"]},"$preview":{"width":390,"height":1260}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const accent = this.props.accent ?? '#7CCAE3';
    const chip = (label, key, current) => {
      const on = label === current;
      return {
        label: label,
        bg: on ? accent : '#FFFFFF',
        bd: on ? accent : '#E2E7EB',
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ [key]: label })
      };
    };
    const type = s.type || '户外';
    const fee = s.fee || 'AA';
    const size = s.size || 5;
    const sw = (on) => ({
      checked: on ? 'true' : 'false',
      justify: on ? 'flex-end' : 'flex-start',
      track: on ? '#193543' : '#B8C0C7'
    });
    const approve = !!s.approve;
    const same = !!s.same;
    return {
      accent: accent,
      types: ['户外', '吃饭', '咖啡', '桌游', '拼车', '其他'].map((t) => chip(t, 'type', type)),
      fees: ['AA', '免费', '我请客'].map((t) => chip(t, 'fee', fee)),
      isAA: fee === 'AA',
      size: size,
      inc: () => this.setState({ size: Math.min(20, size + 1) }),
      dec: () => this.setState({ size: Math.max(2, size - 1) }),
      ap: sw(approve),
      toggleApprove: () => this.setState({ approve: !approve }),
      sm: sw(same),
      toggleSame: () => this.setState({ same: !same }),
      editing: !s.published,
      published: !!s.published,
      publish: () => this.setState({ published: true })
    };
  }
}
</script>
</body>
</html>
