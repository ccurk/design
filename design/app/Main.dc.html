<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F1F4F6; color: #15171C; font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', sans-serif">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 50px 16px 0 20px">

<h1 style="margin: 0; font-size: 30px; line-height: 1.25; font-weight: 800; letter-spacing: -0.01em">今天想做点什么？</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #5B5F68">说出来就好，搭子我们帮你找。<br>不用发帖，也不用先开口。</p>
</div>
<div style="margin: 16px 16px 0; padding: 20px; background: #FFFFFF; border-radius: 28px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 700; color: #5B5F68">想做的事</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tasks}}" as="c" hint-placeholder-count="8">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: #15171C; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 700; color: #5B5F68">什么时候</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{times}}" as="c" hint-placeholder-count="3">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: #15171C; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">{{c.label}}</button>

</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5B5F68"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l7 2.8v5.4c0 4.2-2.9 7.4-7 8.8-4.1-1.4-7-4.6-7-8.8V6.3z"></path><path d="M9 12l2 2 4-4"></path></svg><span>意向只有你自己看得到</span></div>

</div>
</div>
<div style="margin: 18px 16px 0; display: flex; flex-direction: column; gap: 8px">
<div style="padding: 0 4px; font-size: 13px; font-weight: 700; color: #5B5F68">正在为你撮合</div>
<a href="Waiting.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 10px 12px 14px; background: #FFFFFF; border-radius: 20px; color: #15171C; text-decoration: none">
<span aria-hidden="true" style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px; background: #193543; color: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9c2 0 2-1.5 4.5-1.5S9.5 9 12 9s2.5-1.5 4.5-1.5S19 9 21 9"></path><path d="M3 14c2 0 2-1.5 4.5-1.5S9.5 14 12 14s2.5-1.5 4.5-1.5S19 14 21 14"></path><path d="M3 19c2 0 2-1.5 4.5-1.5S9.5 19 12 19s2.5-1.5 4.5-1.5S19 19 21 19"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">周日 · 洱海边骑行</span><span style="font-size: 13px; color: #5B5F68">已有 2 人同意向，还差 1 人成局</span></span>
<span style="flex-shrink: 0; padding: 4px 10px; border-radius: 999px; background: {{accent}}; color: #15171C; font-size: 12px; font-weight: 700">撮合中</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#858C94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg>

<a href="Feed.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 48px; color: #6B6F78; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M20.5 16l-4.5-4.5-7.5 8"></path></svg></span><span style="font-size: 11px; font-weight: 500">动态</span></a>

<a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 48px; color: #6B6F78; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"></circle><path d="M4.5 20c.9-3.8 3.9-6 7.5-6s6.6 2.2 7.5 6"></path></svg></span><span style="font-size: 11px; font-weight: 500">我的</span></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7CCAE3","options":["#7CCAE3","#C4B5FD","#D2F65A","#FDBA74"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const accent = this.props.accent ?? '#7CCAE3';
    const task = s.task || '看日出';
    const when = s.when || '本周末';
    const chip = (label, key, current) => {
      const on = label === current;
      return {
        label: label,
        bg: on ? accent : '#FFFFFF',
        bd: on ? accent : '#E2E7EB',
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ [key]: label })
      };
    };
    return {
      accent: accent,
      tasks: ['吃饭', '咖啡', '爬山', '看日出', '拼车', '桌游', '骑行', '随便走走'].map((t) => chip(t, 'task', task)),
      times: ['今天', '明天', '本周末'].map((t) => chip(t, 'when', when)),
      summary: when + task
    };
  }
}
</script>
</body>
</html>
