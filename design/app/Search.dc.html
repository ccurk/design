<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>搜索</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F1F4F6; color: #15171C; font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', sans-serif">
<div style="display: flex; align-items: center; gap: 4px; padding: 50px 16px 0 4px">
<a href="Square.dc.html" aria-label="返回" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15171C; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg></a>
<h1 style="flex: 1; min-width: 0; margin: 0; font-size: 17px; font-weight: 800">搜索</h1>
<div aria-hidden="true" style="flex-shrink: 0; display: flex; align-items: center; width: 87px; height: 32px; box-sizing: border-box; border: 1px solid #E2E7EB; border-radius: 999px; background: #FFFFFF"><span style="flex: 1; display: flex; justify-content: center; gap: 3px"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span><span style="width: 1px; height: 18px; background: #E2E7EB"></span><span style="flex: 1; display: flex; justify-content: center"><span style="width: 15px; height: 15px; box-sizing: border-box; border: 2px solid #15171C; border-radius: 999px; display: flex; align-items: center; justify-content: center"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span></span></div>
</div>
<div style="margin: 8px 16px 0; display: flex; align-items: center; gap: 8px; height: 48px; box-sizing: border-box; padding: 0 4px 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #D3DAE0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B5F68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">搜索活动</label>
<input id="q" type="search" value="{{q}}" onChange="{{onQ}}" placeholder="搜活动，比如：日出、读书" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; color: #15171C; font-family: inherit; font-size: 15px">
<button type="button" aria-label="清空" onClick="{{clear}}" style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 999px; border: 0; background: transparent; color: #5B5F68; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<sc-if value="{{noQ}}" hint-placeholder-val="{{ true }}">
<div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 700; color: #5B5F68">大家在搜</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{hot}}" as="h" hint-placeholder-count="6">
<button type="button" onClick="{{h.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #E2E7EB; background: #FFFFFF; color: #15171C; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{h.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between"><span style="font-size: 13px; font-weight: 700; color: #5B5F68">最近搜过</span><button type="button" onClick="{{clearRecent}}" style="min-height: 44px; padding: 0 0 0 12px; border: 0; background: transparent; color: #5B5F68; font-family: inherit; font-size: 13px; cursor: pointer">{{clearLabel}}</button></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{recent}}" as="h" hint-placeholder-count="2">
<button type="button" onClick="{{h.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: #E1E7EC; color: #15171C; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{h.label}}</button>
</sc-for>
</div>
</div>
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 20px; background: #193543; color: #FFFFFF; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3.5l1.9 5 5 1.9-5 1.9-1.9 5-1.9-5-5-1.9 5-1.9z"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">懒得搜？</span><span style="font-size: 13px; color: #C9D6DF">说出想做的事，平台帮你凑人</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg></a>
</div>
</sc-if>
<sc-if value="{{hasQ}}" hint-placeholder-val="{{ false }}">
<div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 10px">
<div style="padding: 0 4px; font-size: 13px; color: #5B5F68">找到 {{resultCount}} 个局</div>
<sc-for list="{{results}}" as="r" hint-placeholder-count="2">
<a href="Detail.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 20px; background: #FFFFFF; color: #15171C; text-decoration: none">
<span aria-hidden="true" style="flex-shrink: 0; width: 56px; height: 56px; border-radius: 14px; background: #193543; color: {{r.accent}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">{{r.cat}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 800">{{r.title}}</span><span style="font-size: 12px; color: #5B5F68">{{r.meta}}</span></span>
<span style="flex-shrink: 0; font-size: 13px; color: #3D4048">{{r.count}}</span>
</a>
</sc-for>
<sc-if value="{{noResult}}" hint-placeholder-val="{{ false }}">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 20px; background: #FFFFFF; color: #15171C; text-decoration: none"><span style="flex: 1; font-size: 14px; line-height: 1.6">没搜到相关的局。说出想做的事，让平台帮你撮合一个</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#858C94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg></a>
</sc-if>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7CCAE3","options":["#7CCAE3","#C4B5FD","#D2F65A","#FDBA74"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const accent = this.props.accent ?? '#7CCAE3';
    const q = s.q || '';
    const term = q.trim();
    const all = [
      { cat: '户外', title: '周六清晨 · 苍山看日出', meta: '周六 05:50 · 古城南门集合', count: '4/5 人' },
      { cat: '咖啡', title: '安静读书局 · 不用聊天', meta: '周五 14:00 · 人民路咖啡馆', count: '2/4 人' },
      { cat: '吃饭', title: '喜洲稻田边吃早餐', meta: '周日 08:30 · 喜洲古镇', count: '3/4 人' },
      { cat: '桌游', title: '桌游夜 · 新手友好', meta: '周五 20:00 · 古城内', count: '5/8 人' },
      { cat: '拼车', title: '拼车去双廊', meta: '周六 10:00 · 古城北门出发', count: '3/4 人' },
      { cat: '户外', title: '洱海西岸骑行', meta: '周日 15:00 · 才村码头', count: '2/6 人' }
    ];
    const results = term
      ? all.filter((e) => (e.title + e.meta + e.cat).indexOf(term) >= 0).map((e) => ({ ...e, accent: accent }))
      : [];
    const pickTerm = (t) => () => this.setState({ q: t });
    const recentList = s.recentCleared ? [] : ['咖啡', '爬山'];
    return {
      accent: accent,
      q: q,
      onQ: (e) => this.setState({ q: e.target.value }),
      clear: () => this.setState({ q: '' }),
      noQ: !term,
      hasQ: !!term,
      hot: ['看日出', '安静读书', '骑行', '桌游', '拼车去双廊', '早餐'].map((t) => ({ label: t, pick: pickTerm(t) })),
      recent: recentList.map((t) => ({ label: t, pick: pickTerm(t) })),
      clearLabel: recentList.length ? '清除' : '已清除',
      clearRecent: () => this.setState({ recentCleared: true }),
      results: results,
      resultCount: results.length,
      noResult: !!term && results.length === 0
    };
  }
}
</script>
</body>
</html>
