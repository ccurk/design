<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>撮合中</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F1F4F6; color: #15171C; font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', sans-serif">
<div style="display: flex; align-items: center; gap: 4px; padding: 50px 16px 0 4px">
<a href="Main.dc.html" aria-label="返回" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15171C; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg></a>
<h1 style="flex: 1; min-width: 0; margin: 0; font-size: 17px; font-weight: 800">撮合中</h1>
<div aria-hidden="true" style="flex-shrink: 0; display: flex; align-items: center; width: 87px; height: 32px; box-sizing: border-box; border: 1px solid #E2E7EB; border-radius: 999px; background: #FFFFFF"><span style="flex: 1; display: flex; justify-content: center; gap: 3px"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span><span style="width: 1px; height: 18px; background: #E2E7EB"></span><span style="flex: 1; display: flex; justify-content: center"><span style="width: 15px; height: 15px; box-sizing: border-box; border: 2px solid #15171C; border-radius: 999px; display: flex; align-items: center; justify-content: center"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span></span></div>
</div>
<div style="margin: 12px 16px 0; padding: 18px; border-radius: 28px; background: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 14px; background: #193543; color: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9c2 0 2-1.5 4.5-1.5S9.5 9 12 9s2.5-1.5 4.5-1.5S19 9 21 9"></path><path d="M3 14c2 0 2-1.5 4.5-1.5S9.5 14 12 14s2.5-1.5 4.5-1.5S19 14 21 14"></path><path d="M3 19c2 0 2-1.5 4.5-1.5S9.5 19 12 19s2.5-1.5 4.5-1.5S19 19 21 19"></path></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 18px; font-weight: 800">周日 · 洱海边骑行</div>
<div style="font-size: 13px; color: #5B5F68">下午 · 3 人左右 · 古城附近出发</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="flex-shrink: 0; display: flex">
<span style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 999px; border: 2px solid #FFFFFF; background: #2E4A5C; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.8"></circle><path d="M4.5 20c.9-3.8 3.9-6 7.5-6s6.6 2.2 7.5 6"></path></svg></span>
<span style="width: 36px; height: 36px; box-sizing: border-box; margin-left: -10px; border-radius: 999px; border: 2px solid #FFFFFF; background: #193543; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.8"></circle><path d="M4.5 20c.9-3.8 3.9-6 7.5-6s6.6 2.2 7.5 6"></path></svg></span>
<span style="width: 36px; height: 36px; box-sizing: border-box; margin-left: -10px; border-radius: 999px; border: 2px dashed #858C94; background: #FFFFFF; color: #5B5F68; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">已有 2 人同意向</span><span style="font-size: 13px; line-height: 1.45; color: #5B5F68">还差 1 人就能成局 · 成局前互相看不到是谁</span></div>
</div>
<div aria-hidden="true" style="height: 6px; border-radius: 999px; background: #E8ECEF; overflow: hidden"><div style="width: 66%; height: 6px; border-radius: 999px; background: #193543"></div></div>
</div>
<ol style="margin: 12px 16px 0; padding: 12px 16px; list-style: none; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
<li style="display: flex; align-items: center; gap: 12px; min-height: 40px"><span aria-hidden="true" style="flex-shrink: 0; width: 24px; height: 24px; border-radius: 999px; background: #193543; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"></path></svg></span><span style="flex: 1; font-size: 14px">已提交意向</span><span style="font-size: 12px; color: #5B5F68">今天 10:24</span></li>
<li style="display: flex; align-items: center; gap: 12px; min-height: 40px"><span aria-hidden="true" style="flex-shrink: 0; width: 24px; height: 24px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 999px; background: #15171C"></span></span><span style="flex: 1; font-size: 14px; font-weight: 700">正在找同频的人</span><span style="font-size: 12px; color: #5B5F68">通常 24 小时内</span></li>
<li style="display: flex; align-items: center; gap: 12px; min-height: 40px"><span aria-hidden="true" style="flex-shrink: 0; width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 2px solid #B8C0C7"></span><span style="flex: 1; font-size: 14px; color: #5B5F68">凑齐后自动成局、建群</span></li>
</ol>
<div style="margin: 12px 16px 0; padding: 14px 14px 14px 16px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; gap: 12px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#193543" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg>
<div style="flex: 1; min-width: 0; font-size: 13px; line-height: 1.5; color: #3D4048">有结果会用微信服务通知告诉你，不用一直盯着</div>
<button type="button" aria-pressed="{{notifyPressed}}" onClick="{{toggleNotify}}" style="flex-shrink: 0; min-height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; border: {{nBorder}}; background: {{nBg}}; color: {{nFg}}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{nLabel}}</button>
</div>
<div style="margin: 16px 20px 0; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 700; color: #5B5F68">放宽一点，成局更快</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{relax}}" as="c" hint-placeholder-count="2">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: #15171C; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; flex-direction: column; gap: 4px">
<a href="Square.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; box-sizing: border-box; border-radius: 999px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; font-size: 15px; font-weight: 700; text-decoration: none">等的时候，先去广场逛逛</a>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; color: #5B5F68; font-size: 14px; font-weight: 500; text-decoration: none">取消这个意向</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7CCAE3","options":["#7CCAE3","#C4B5FD","#D2F65A","#FDBA74"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const accent = this.props.accent ?? '#7CCAE3';
    const relaxed = s.relaxed || [];
    const relax = ['时间放宽到全天', '2–6 人都可以'].map((t) => {
      const on = relaxed.indexOf(t) >= 0;
      return {
        label: t,
        bg: on ? accent : '#FFFFFF',
        bd: on ? accent : '#E2E7EB',
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ relaxed: on ? relaxed.filter((x) => x !== t) : relaxed.concat([t]) })
      };
    });
    const on = !!s.notify;
    return {
      accent: accent,
      relax: relax,
      notifyPressed: on ? 'true' : 'false',
      toggleNotify: () => this.setState({ notify: !on }),
      nLabel: on ? '已开启' : '开启提醒',
      nBg: on ? '#FFFFFF' : '#193543',
      nFg: on ? '#193543' : '#FFFFFF',
      nBorder: on ? '1px solid #D3DAE0' : '0'
    };
  }
}
</script>
</body>
</html>
