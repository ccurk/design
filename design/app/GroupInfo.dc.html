<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px"><span aria-hidden="true" style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 999px; background: {{accent}}; color: #15171C; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">栗</span><span style="flex: 1; font-size: 15px; font-weight: 500">栗子（我）</span><span style="font-size: 12px; color: #5B5F68">履约 100%</span></div>

<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 8px 0 16px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg><span style="flex: 1; font-size: 15px; font-weight: 500">消息免打扰</span><button type="button" role="switch" aria-checked="{{muteChecked}}" aria-label="消息免打扰" onClick="{{toggleMute}}" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 56px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer"><span style="display: flex; justify-content: {{muteJustify}}; width: 52px; height: 32px; box-sizing: border-box; padding: 3px; border-radius: 999px; background: {{muteTrack}}"><span style="width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(21, 23, 28, 0.25)"></span></span></button></div>

<button type="button" onClick="{{askLeave}}" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 48px; box-sizing: border-box; border-radius: 999px; border: 1px solid #F1C7C2; background: #FFFFFF; color: #B42318; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4.5h4.5v15H14"></path><path d="M10 8l-4 4 4 4"></path><path d="M6 12h9"></path></svg><span>退出这个局</span></button>
</div>
<sc-if value="{{leaving}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(21, 23, 28, 0.45); display: flex; flex-direction: column; justify-content: flex-end">
<section aria-label="确认退出" style="padding: 24px 20px 34px; border-radius: 28px 28px 0 0; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 20px; font-weight: 800">确定退出这个局吗？</div>
<div style="font-size: 14px; line-height: 1.6; color: #3D4048">现在退出不影响信用，名额会让给候补的人。开场前 24 小时内退出，会记一次「临时鸽」。</div>
<div style="display: flex; gap: 10px; padding-top: 8px">
<button type="button" onClick="{{cancelLeave}}" style="flex: 1; height: 52px; border-radius: 999px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">再想想</button>
<a href="Main.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 999px; background: #B42318; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none">确定退出</a>
</div>
</section>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7CCAE3","options":["#7CCAE3","#C4B5FD","#D2F65A","#FDBA74"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const mute = !!s.mute;
    return {
      accent: this.props.accent ?? '#7CCAE3',
      muteChecked: mute ? 'true' : 'false',
      muteJustify: mute ? 'flex-end' : 'flex-start',
      muteTrack: mute ? '#193543' : '#B8C0C7',
      toggleMute: () => this.setState({ mute: !mute }),
      leaving: !!s.leaving,
      askLeave: () => this.setState({ leaving: true }),
      cancelLeave: () => this.setState({ leaving: false })
    };
  }
}
</script>
</body>
