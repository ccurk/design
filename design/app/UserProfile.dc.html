<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>阿野的主页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F1F4F6; color: #15171C; font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', sans-serif">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 50px 16px 0 4px">
<a href="GroupInfo.dc.html" aria-label="返回" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15171C; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg></a>
<div aria-hidden="true" style="flex-shrink: 0; display: flex; align-items: center; width: 87px; height: 32px; box-sizing: border-box; border: 1px solid #E2E7EB; border-radius: 999px; background: #FFFFFF"><span style="flex: 1; display: flex; justify-content: center; gap: 3px"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span><span style="width: 1px; height: 18px; background: #E2E7EB"></span><span style="flex: 1; display: flex; justify-content: center"><span style="width: 15px; height: 15px; box-sizing: border-box; border: 2px solid #15171C; border-radius: 999px; display: flex; align-items: center; justify-content: center"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span></span></div>
</div>
<div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 16px">
<span aria-hidden="true" style="flex-shrink: 0; width: 72px; height: 72px; border-radius: 999px; background: #E3E8EC; color: #15171C; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800">野</span>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 800">阿野</h1>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: #FFFFFF; color: #193543; font-size: 12px; font-weight: 700"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"></path></svg><span>已实名</span></span>
<span style="display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: #FFFFFF; color: #193543; font-size: 12px; font-weight: 700"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"></path></svg><span>手机已验证</span></span>
</div>
</div>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #3D4048">户外爱好者，话不多。爬山会多带暖宝宝和一份早饭。</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="padding: 6px 12px; border-radius: 999px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #3D4048; font-size: 13px">爬山</span>
<span style="padding: 6px 12px; border-radius: 999px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #3D4048; font-size: 13px">骑行</span>
<span style="padding: 6px 12px; border-radius: 999px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #3D4048; font-size: 13px">看日出</span>
</div>
</div>
<div style="margin: 16px 16px 0; padding: 18px 8px 14px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em">98%</span><span style="font-size: 12px; color: #5B5F68">履约率</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em">23</span><span style="font-size: 12px; color: #5B5F68">参加的局</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em">1</span><span style="font-size: 12px; color: #5B5F68">临时取消</span></div>
</div>
<div style="height: 1px; margin: 0 12px; background: #E8ECEF"></div>
<div style="padding: 0 12px; font-size: 12px; line-height: 1.5; color: #5B5F68">那 1 次是 3 个月前、开场前 20 小时说的，没有放鸽子记录。</div>
</div>
<div style="margin: 14px 20px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<span style="margin-right: 2px; font-size: 12px; font-weight: 700; color: #5B5F68">你们的共同点</span>
<span style="padding: 6px 10px; border-radius: 999px; background: #FFFFFF; font-size: 12px; color: #15171C">都喜欢看日出</span>
<span style="padding: 6px 10px; border-radius: 999px; background: #FFFFFF; font-size: 12px; color: #15171C">都偏安静</span>
</div>
<div style="margin: 18px 20px 8px; font-size: 13px; font-weight: 700; color: #5B5F68">最近的局</div>
<div style="margin: 0 16px; padding: 4px 0; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column">
<a href="Detail.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 12px 0 16px; color: #15171C; text-decoration: none"><span aria-hidden="true" style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 12px; background: #193543; color: {{accent}}; display: flex; align-items: flex-end; overflow: hidden"><svg width="36" height="24" viewBox="0 0 36 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="25" cy="8" r="3.5"></circle><path d="M0 23l8-8 6 4 7-8 7 8 8 4"></path></svg></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">周六清晨 · 苍山看日出</span><span style="font-size: 12px; color: #5B5F68">本周六 · 和你同一个局</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#858C94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg></a>
<div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px"><span aria-hidden="true" style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 12px; background: #2E4A5C; color: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9c2 0 2-1.5 4.5-1.5S9.5 9 12 9s2.5-1.5 4.5-1.5S19 9 21 9"></path><path d="M3 14c2 0 2-1.5 4.5-1.5S9.5 14 12 14s2.5-1.5 4.5-1.5S19 14 21 14"></path><path d="M3 19c2 0 2-1.5 4.5-1.5S9.5 19 12 19s2.5-1.5 4.5-1.5S19 19 21 19"></path></svg></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">洱海西岸骑行</span><span style="font-size: 12px; color: #5B5F68">上周日 · 已结束</span></span></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px"><span aria-hidden="true" style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 12px; background: #E3E8EC; color: #15171C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19l6-8 4 5 3-3.5L21 19z"></path><circle cx="16.5" cy="6.5" r="2"></circle></svg></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">苍山小环线徒步</span><span style="font-size: 12px; color: #5B5F68">两周前 · 已结束</span></span></div>
</div>
<div style="margin: 12px 20px 0; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5B5F68"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l7 2.8v5.4c0 4.2-2.9 7.4-7 8.8-4.1-1.4-7-4.6-7-8.8V6.3z"></path><path d="M9 12l2 2 4-4"></path></svg><span>这里不能私聊，只在同一个局里聊天，防骚扰</span></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 16px 30px; background: #FFFFFF; border-top: 1px solid #E2E7EB; display: flex; gap: 10px">
<a href="Report.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 52px; box-sizing: border-box; border-radius: 999px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; font-size: 15px; font-weight: 700; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 21V4.5"></path><path d="M5.5 5h11l-2 4 2 4h-11"></path></svg><span>举报</span></a>
<button type="button" aria-pressed="{{blockPressed}}" onClick="{{toggleBlock}}" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 52px; box-sizing: border-box; border-radius: 999px; border: 1px solid {{bBorder}}; background: {{bBg}}; color: {{bFg}}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M6 6l12 12"></path></svg><span>{{bLabel}}</span></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7CCAE3","options":["#7CCAE3","#C4B5FD","#D2F65A","#FDBA74"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const blocked = !!s.blocked;
    return {
      accent: this.props.accent ?? '#7CCAE3',
      blockPressed: blocked ? 'true' : 'false',
      toggleBlock: () => this.setState({ blocked: !blocked }),
      bLabel: blocked ? '已拉黑 · 点击撤销' : '拉黑',
      bBorder: blocked ? '#E2E7EB' : '#F1C7C2',
      bBg: blocked ? '#F1F4F6' : '#FFFFFF',
      bFg: blocked ? '#3D4048' : '#B42318'
    };
  }
}
</script>
</body>
</html>
