<a href="Square.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 48px; color: #6B6F78; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg></span><span style="font-size: 11px; font-weight: 500">广场</span></a>

<button type="button" onClick="{{closeMore}}" style="min-height: 56px; border: 0; background: transparent; color: #5B5F68; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">取消</button>
</section>
</div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7CCAE3","options":["#7CCAE3","#C4B5FD","#D2F65A","#FDBA74"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const l1 = !!s.l1;
    const l2 = !!s.l2;
    return {
      accent: this.props.accent ?? '#7CCAE3',
      l1fill: l1 ? '#15171C' : 'none',
      l1count: l1 ? 24 : 23,
      l1pressed: l1 ? 'true' : 'false',
      like1: () => this.setState({ l1: !l1 }),
      l2fill: l2 ? '#15171C' : 'none',
      l2count: l2 ? 42 : 41,
      l2pressed: l2 ? 'true' : 'false',
      like2: () => this.setState({ l2: !l2 }),
      more: !!s.more,
      openMore: () => this.setState({ more: true, toast: false }),
      closeMore: () => this.setState({ more: false }),
      hideAuthor: () => this.setState({ more: false, toast: true }),
      toast: !!s.toast
    };
  }
}
</script>
