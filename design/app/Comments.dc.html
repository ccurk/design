<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>动态详情</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F1F4F6; color: #15171C; font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', sans-serif">
<div style="display: flex; align-items: center; gap: 4px; padding: 50px 16px 0 4px">
<a href="Feed.dc.html" aria-label="返回" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15171C; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg></a>
<h1 style="flex: 1; min-width: 0; margin: 0; font-size: 17px; font-weight: 800">动态详情</h1>
<div aria-hidden="true" style="flex-shrink: 0; display: flex; align-items: center; width: 87px; height: 32px; box-sizing: border-box; border: 1px solid #E2E7EB; border-radius: 999px; background: #FFFFFF"><span style="flex: 1; display: flex; justify-content: center; gap: 3px"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span><span style="width: 1px; height: 18px; background: #E2E7EB"></span><span style="flex: 1; display: flex; justify-content: center"><span style="width: 15px; height: 15px; box-sizing: border-box; border: 2px solid #15171C; border-radius: 999px; display: flex; align-items: center; justify-content: center"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span></span></div>
</div>
<div style="position: absolute; left: 0; right: 0; top: 94px; bottom: 84px; box-sizing: border-box; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 14px">
<article style="flex-shrink: 0; padding: 12px 8px 12px 16px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 4px">
<a href="UserProfile.dc.html" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 44px; color: #15171C; text-decoration: none"><span aria-hidden="true" style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 999px; background: #E3E8EC; color: #15171C; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">野</span><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 700">阿野</span><span style="font-size: 12px; color: #5B5F68">2 小时前 · 履约 98%</span></span></a>
<button type="button" aria-label="更多操作" onClick="{{openMore}}" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: #5B5F68; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="5.5" cy="12" r="1.6" fill="currentColor"></circle><circle cx="12" cy="12" r="1.6" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.6" fill="currentColor"></circle></svg></button>
</div>
<p style="margin: 0; padding-right: 8px; font-size: 15px; line-height: 1.6">凌晨爬起来真的值。一路上没人尬聊，太阳出来那一刻大家都没说话，刚刚好。</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding-right: 8px">
<div aria-hidden="true" style="height: 120px; border-radius: 16px 6px 6px 16px; background: #193543; color: {{accent}}; overflow: hidden"><svg width="100%" height="120" viewBox="0 0 160 120" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="108" cy="44" r="12"></circle><path d="M0 116L40 76l26 16 38-42 36 46 20-12"></path></svg></div>
<div aria-hidden="true" style="height: 120px; border-radius: 6px 16px 16px 6px; background: {{accent}}; color: #15171C; overflow: hidden"><svg width="100%" height="120" viewBox="0 0 160 120" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 84h128"></path><path d="M50 84a30 30 0 0 1 60 0"></path><path d="M80 44V30"></path><path d="M52 56l-9-9"></path><path d="M108 56l9-9"></path><path d="M44 98h30"></path><path d="M86 98h30"></path></svg></div>
</div>
<div style="display: flex; align-items: center; gap: 2px">
<a href="Detail.dc.html" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; background: #F1F4F6; color: #15171C; font-size: 13px; font-weight: 700; text-decoration: none"><span>来自局：苍山看日出</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg></a>
<button type="button" aria-pressed="{{likePressed}}" aria-label="喜欢 {{likeCount}}" onClick="{{like}}" style="margin-left: auto; display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 8px; border: 0; background: transparent; color: #15171C; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="{{likeFill}}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19.5s-7-4.3-7-9.4A3.9 3.9 0 0 1 12 7.6a3.9 3.9 0 0 1 7 2.5c0 5.1-7 9.4-7 9.4z"></path></svg><span>{{likeCount}}</span></button>
</div>
</article>
<div style="flex-shrink: 0; display: flex; align-items: baseline; gap: 6px; padding: 0 4px"><span style="font-size: 15px; font-weight: 800">评论</span><span style="font-size: 13px; color: #5B5F68">{{count}}</span></div>
<sc-for list="{{comments}}" as="c" hint-placeholder-count="5">
<div style="flex-shrink: 0; display: flex; gap: 10px; padding: 0 4px">
<span aria-hidden="true" style="flex-shrink: 0; width: 32px; height: 32px; margin-top: 6px; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{c.av}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 6px; min-height: 44px"><span style="font-size: 13px; font-weight: 700">{{c.name}}</span><span style="font-size: 12px; color: #5B5F68">{{c.time}}</span><button type="button" onClick="{{c.reply}}" style="margin-left: auto; min-height: 44px; padding: 0 4px 0 12px; border: 0; background: transparent; color: #5B5F68; font-family: inherit; font-size: 13px; cursor: pointer">回复</button></div>
<div style="font-size: 15px; line-height: 1.55">{{c.text}}</div>
</div>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 10px 12px 30px; background: #FFFFFF; border-top: 1px solid #E2E7EB; display: flex; align-items: center; gap: 8px">
<label for="cmt" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">写评论</label>
<input id="cmt" type="text" value="{{draft}}" onChange="{{onDraft}}" placeholder="{{ph}}" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; font-family: inherit; font-size: 15px">
<button type="button" aria-label="发送" onClick="{{send}}" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 999px; border: 0; background: #193543; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3.5L10.5 14"></path><path d="M21 3.5l-6.5 17-4-6.5-6.5-4z"></path></svg></button>
</div>
<sc-if value="{{more}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(21, 23, 28, 0.45); display: flex; flex-direction: column; justify-content: flex-end">
<section aria-label="更多操作" style="padding: 8px 16px 34px; border-radius: 28px 28px 0 0; background: #FFFFFF; display: flex; flex-direction: column">
<a href="Report.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 8px; border-bottom: 1px solid #E8ECEF; color: #15171C; font-size: 16px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 21V4.5"></path><path d="M5.5 5h11l-2 4 2 4h-11"></path></svg><span>举报这条动态</span></a>
<button type="button" onClick="{{closeMore}}" style="min-height: 56px; border: 0; background: transparent; color: #5B5F68; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">取消</button>
</section>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7CCAE3","options":["#7CCAE3","#C4B5FD","#D2F65A","#FDBA74"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const accent = this.props.accent ?? '#7CCAE3';
    const base = [
      { name: '小满', av: '满', bg: '#193543', fg: '#FFFFFF', time: '1 小时前', text: '那天的云太好看了，下次还一起' },
      { name: '木木', av: '木', bg: accent, fg: '#15171C', time: '58 分钟前', text: '求下次带上我！' },
      { name: '七七', av: '七', bg: '#2E4A5C', fg: '#FFFFFF', time: '40 分钟前', text: '照片拍得好安静' },
      { name: '南风', av: '南', bg: '#E3E8EC', fg: '#15171C', time: '20 分钟前', text: '想问下几点出发能赶上日出？' },
      { name: '阿野', av: '野', bg: '#E3E8EC', fg: '#15171C', time: '18 分钟前', text: '回复 南风：5:50 古城南门集合刚好' }
    ];
    const added = s.added || [];
    const list = base.concat(added.map((a) => ({ name: '栗子', av: '栗', bg: accent, fg: '#15171C', time: '刚刚', text: a })));
    const replyTo = s.replyTo || '';
    const draft = s.draft || '';
    const liked = !!s.liked;
    return {
      accent: accent,
      comments: list.map((c) => ({ ...c, reply: () => this.setState({ replyTo: c.name }) })),
      count: list.length,
      ph: replyTo ? '回复 ' + replyTo + '：' : '说点什么…',
      draft: draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      send: () => {
        if (draft.trim()) {
          const text = (replyTo ? '回复 ' + replyTo + '：' : '') + draft.trim();
          this.setState({ added: added.concat([text]), draft: '', replyTo: '' });
        }
      },
      likePressed: liked ? 'true' : 'false',
      likeCount: liked ? 24 : 23,
      likeFill: liked ? '#15171C' : 'none',
      like: () => this.setState({ liked: !liked }),
      more: !!s.more,
      openMore: () => this.setState({ more: true }),
      closeMore: () => this.setState({ more: false })
    };
  }
}
</script>
</body>
</html>
