<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>选兴趣</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F1F4F6; color: #15171C; font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', sans-serif">
<div style="display: flex; align-items: center; gap: 4px; padding: 50px 16px 0 4px">
<a href="Login.dc.html" aria-label="返回" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15171C; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg></a>
<span style="flex: 1; font-size: 13px; color: #5B5F68">第 2 步，共 2 步</span>
<div aria-hidden="true" style="flex-shrink: 0; display: flex; align-items: center; width: 87px; height: 32px; box-sizing: border-box; border: 1px solid #E2E7EB; border-radius: 999px; background: #FFFFFF"><span style="flex: 1; display: flex; justify-content: center; gap: 3px"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span><span style="width: 1px; height: 18px; background: #E2E7EB"></span><span style="flex: 1; display: flex; justify-content: center"><span style="width: 15px; height: 15px; box-sizing: border-box; border: 2px solid #15171C; border-radius: 999px; display: flex; align-items: center; justify-content: center"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span></span></div>
</div>
<div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 26px; line-height: 1.3; font-weight: 800; letter-spacing: -0.01em">你平时喜欢做什么？</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #5B5F68">选 3 个以上，撮合会更准。之后随时能改。</p>
</div>
<div style="padding: 18px 20px 0; display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tags}}" as="c" hint-placeholder-count="18">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: #15171C; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
<div style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 15px; font-weight: 800">在人群里，你通常是？</div>
<sc-for list="{{paces}}" as="p" hint-placeholder-count="3">
<button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: {{p.bw}} solid {{p.bd}}; background: #FFFFFF; color: #15171C; font-family: inherit; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer"><span>{{p.label}}</span><span aria-hidden="true" style="flex-shrink: 0; width: 20px; height: 20px; box-sizing: border-box; border-radius: 999px; border: {{p.dot}}"></span></button>
</sc-for>
<div style="font-size: 12px; color: #5B5F68">只用来帮你配节奏相近的人，不会展示给别人。</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 20px 30px; background: #FFFFFF; border-top: 1px solid #E2E7EB">
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #193543; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">开始找搭子 · 已选 {{count}} 个</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7CCAE3","options":["#7CCAE3","#C4B5FD","#D2F65A","#FDBA74"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const accent = this.props.accent ?? '#7CCAE3';
    const picked = s.picked || ['看日出', '咖啡', '骑行'];
    const pace = s.pace || '比较慢热，先听大家聊';
    const all = ['看日出', '爬山', '徒步', '骑行', '咖啡', '读书', '拍照', '吃饭', '夜市', '桌游', '电影', '瑜伽', '冥想', '画画', '拼车', '逛古镇', '听现场', '随便走走'];
    const tags = all.map((t) => {
      const on = picked.indexOf(t) >= 0;
      return {
        label: t,
        bg: on ? accent : '#FFFFFF',
        bd: on ? accent : '#E2E7EB',
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ picked: on ? picked.filter((x) => x !== t) : picked.concat([t]) })
      };
    });
    const paces = ['比较慢热，先听大家聊', '熟了就话多', '随时都能聊'].map((p) => {
      const on = p === pace;
      return {
        label: p,
        pressed: on ? 'true' : 'false',
        bw: on ? '2px' : '1px',
        bd: on ? '#193543' : '#E2E7EB',
        dot: on ? '6px solid #193543' : '2px solid #B8C0C7',
        pick: () => this.setState({ pace: p })
      };
    });
    return { accent: accent, tags: tags, paces: paces, count: picked.length };
  }
}
</script>
</body>
</html>
