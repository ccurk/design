<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>安全设置</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F1F4F6; color: #15171C; font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', sans-serif">
<div style="display: flex; align-items: center; gap: 4px; padding: 50px 16px 0 4px">
<a href="Profile.dc.html" aria-label="返回" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15171C; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg></a>
<h1 style="flex: 1; min-width: 0; margin: 0; font-size: 17px; font-weight: 800">安全设置</h1>
<div aria-hidden="true" style="flex-shrink: 0; display: flex; align-items: center; width: 87px; height: 32px; box-sizing: border-box; border: 1px solid #E2E7EB; border-radius: 999px; background: #FFFFFF"><span style="flex: 1; display: flex; justify-content: center; gap: 3px"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span><span style="width: 1px; height: 18px; background: #E2E7EB"></span><span style="flex: 1; display: flex; justify-content: center"><span style="width: 15px; height: 15px; box-sizing: border-box; border: 2px solid #15171C; border-radius: 999px; display: flex; align-items: center; justify-content: center"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span></span></div>
</div>
<div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 10px">
<div style="padding: 0 4px; font-size: 13px; font-weight: 700; color: #5B5F68">参加局的时候</div>
<div style="padding: 4px 8px 4px 16px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 12px; min-height: 68px">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">只参加同性局</span><span style="font-size: 12px; color: #5B5F68">撮合和广场都只给你看同性局</span></span>
<button type="button" role="switch" aria-checked="{{s1.checked}}" aria-label="只参加同性局" onClick="{{s1.toggle}}" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 56px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer"><span style="display: flex; justify-content: {{s1.justify}}; width: 52px; height: 32px; box-sizing: border-box; padding: 3px; border-radius: 999px; background: {{s1.track}}"><span style="width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(21, 23, 28, 0.25)"></span></span></button>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 68px; border-top: 1px solid #E8ECEF">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">结束后提醒我报平安</span><span style="font-size: 12px; line-height: 1.5; color: #5B5F68">结束 1 小时没回复，会通知你的紧急联系人</span></span>
<button type="button" role="switch" aria-checked="{{s2.checked}}" aria-label="结束后提醒我报平安" onClick="{{s2.toggle}}" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 56px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer"><span style="display: flex; justify-content: {{s2.justify}}; width: 52px; height: 32px; box-sizing: border-box; padding: 3px; border-radius: 999px; background: {{s2.track}}"><span style="width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(21, 23, 28, 0.25)"></span></span></button>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 68px; border-top: 1px solid #E8ECEF">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">同局的人可以看我的主页</span><span style="font-size: 12px; color: #5B5F68">关掉后只显示昵称和履约率</span></span>
<button type="button" role="switch" aria-checked="{{s3.checked}}" aria-label="同局的人可以看我的主页" onClick="{{s3.toggle}}" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 56px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer"><span style="display: flex; justify-content: {{s3.justify}}; width: 52px; height: 32px; box-sizing: border-box; padding: 3px; border-radius: 999px; background: {{s3.track}}"><span style="width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(21, 23, 28, 0.25)"></span></span></button>
</div>
</div>
<div style="padding: 8px 4px 0; font-size: 13px; font-weight: 700; color: #5B5F68">紧急联系人</div>
<div style="padding: 12px 12px 12px 16px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 999px; background: #E3E8EC; color: #15171C; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{cInitial}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{cName}}</span><span style="font-size: 13px; color: #5B5F68">{{cPhone}}</span></span>
<button type="button" aria-expanded="{{contactExpanded}}" onClick="{{toggleContact}}" style="flex-shrink: 0; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{contactBtn}}</button>
</div>
<sc-if value="{{showContactForm}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 2px 4px 4px 0">
<label for="cname" style="font-size: 12px; font-weight: 700; color: #5B5F68">称呼</label>
<input id="cname" type="text" value="{{draftName}}" onChange="{{onCName}}" placeholder="比如：妈妈" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; font-family: inherit; font-size: 15px">
<label for="cphone" style="font-size: 12px; font-weight: 700; color: #5B5F68">手机号</label>
<input id="cphone" type="tel" value="{{draftPhone}}" onChange="{{onCPhone}}" placeholder="11 位手机号" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; font-family: inherit; font-size: 15px">
<button type="button" onClick="{{saveContact}}" style="height: 44px; border-radius: 999px; border: 0; background: #193543; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">保存</button>
<div style="font-size: 12px; line-height: 1.5; color: #5B5F68">只在你开启「报平安」又没回复时联系 TA，不会给别人看。</div>
</div>
</sc-if>
</div>
<div style="padding: 8px 4px 0; font-size: 13px; font-weight: 700; color: #5B5F68">黑名单</div>
<div style="padding: 4px 0; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column">
<button type="button" aria-expanded="{{blackOpen}}" onClick="{{toggleBlack}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 0 16px; border: 0; background: transparent; color: #15171C; font-family: inherit; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M6 6l12 12"></path></svg><span style="flex: 1; font-size: 15px; font-weight: 500">黑名单</span><span style="font-size: 13px; color: #5B5F68">{{blackCount}} 人</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#858C94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{chevDeg}}deg)"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg></button>
<sc-if value="{{showBlocked}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 12px 0 16px; border-top: 1px solid #E8ECEF">
<span aria-hidden="true" style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 999px; background: #E3E8EC; color: #15171C; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">鹏</span>
<span style="flex: 1; font-size: 15px">大鹏</span>
<button type="button" onClick="{{unblock}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">移出</button>
</div>
</sc-if>
<sc-if value="{{showEmpty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 4px 16px 14px; font-size: 13px; color: #5B5F68">黑名单是空的</div>
</sc-if>
</div>
<a href="tel:110" style="margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; box-sizing: border-box; border-radius: 999px; border: 1px solid #F1C7C2; background: #FFFFFF; color: #B42318; font-size: 15px; font-weight: 700; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h3l1.5 4-2 1.5a11 11 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16.5 16.5 0 0 1 4.5 5.5a2 2 0 0 1 2-2z"></path></svg><span>遇到危险？一键拨打 110</span></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7CCAE3","options":["#7CCAE3","#C4B5FD","#D2F65A","#FDBA74"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const val = (key, def) => (s[key] === undefined ? def : s[key]);
    const sw = (key, def) => {
      const on = val(key, def);
      return {
        checked: on ? 'true' : 'false',
        justify: on ? 'flex-end' : 'flex-start',
        track: on ? '#193543' : '#B8C0C7',
        toggle: () => this.setState({ [key]: !on })
      };
    };
    const open = !!s.blackOpen;
    const removed = !!s.removed;
    const cName = s.cName || '妈妈';
    const cPhoneRaw = s.cPhone || '13800005678';
    const mask = (p) => (p.length >= 7 ? p.slice(0, 3) + ' **** ' + p.slice(-4) : p);
    const editing = !!s.editingContact;
    return {
      accent: this.props.accent ?? '#7CCAE3',
      cInitial: cName.slice(0, 1),
      cName: cName,
      cPhone: mask(cPhoneRaw),
      contactExpanded: editing ? 'true' : 'false',
      contactBtn: editing ? '收起' : '更换',
      toggleContact: () => this.setState({ editingContact: !editing, draftName: cName, draftPhone: cPhoneRaw }),
      showContactForm: editing,
      draftName: s.draftName === undefined ? cName : s.draftName,
      draftPhone: s.draftPhone === undefined ? cPhoneRaw : s.draftPhone,
      onCName: (e) => this.setState({ draftName: e.target.value }),
      onCPhone: (e) => this.setState({ draftPhone: e.target.value }),
      saveContact: () => this.setState({
        editingContact: false,
        cName: (s.draftName || '').trim() || cName,
        cPhone: (s.draftPhone || '').trim() || cPhoneRaw
      }),
      s1: sw('sameSex', false),
      s2: sw('checkIn', true),
      s3: sw('profileOpen', true),
      blackOpen: open ? 'true' : 'false',
      toggleBlack: () => this.setState({ blackOpen: !open }),
      chevDeg: open ? 90 : 0,
      blackCount: removed ? 0 : 1,
      showBlocked: open && !removed,
      showEmpty: open && removed,
      unblock: () => this.setState({ removed: true })
    };
  }
}
</script>
</body>
</html>
