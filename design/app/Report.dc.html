<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>举报</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F1F4F6; color: #15171C; font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', sans-serif">
<div style="display: flex; align-items: center; gap: 4px; padding: 50px 16px 0 4px">
<a href="GroupInfo.dc.html" aria-label="返回" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15171C; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg></a>
<h1 style="flex: 1; min-width: 0; margin: 0; font-size: 17px; font-weight: 800">举报</h1>
<div aria-hidden="true" style="flex-shrink: 0; display: flex; align-items: center; width: 87px; height: 32px; box-sizing: border-box; border: 1px solid #E2E7EB; border-radius: 999px; background: #FFFFFF"><span style="flex: 1; display: flex; justify-content: center; gap: 3px"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span><span style="width: 1px; height: 18px; background: #E2E7EB"></span><span style="flex: 1; display: flex; justify-content: center"><span style="width: 15px; height: 15px; box-sizing: border-box; border: 2px solid #15171C; border-radius: 999px; display: flex; align-items: center; justify-content: center"><span style="width: 4px; height: 4px; border-radius: 999px; background: #15171C"></span></span></span></div>
</div>
<sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
<div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 16px; background: #E1E7EC; font-size: 13px; line-height: 1.5; color: #3D4048"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3.5l7 2.8v5.4c0 4.2-2.9 7.4-7 8.8-4.1-1.4-7-4.6-7-8.8V6.3z"></path><path d="M9 12l2 2 4-4"></path></svg><span>只有平台能看到你的举报，对方不会知道是谁。</span></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 15px; font-weight: 800">举报原因</span><span style="font-size: 12px; font-weight: 700; color: {{hintColor}}">{{hint}}</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{reasons}}" as="r" hint-placeholder-count="7">
<button type="button" aria-pressed="{{r.pressed}}" onClick="{{r.pick}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid {{r.bd}}; background: {{r.bg}}; color: #15171C; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{r.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="detail" style="font-size: 15px; font-weight: 800">补充说明（选填）</label>
<textarea id="detail" placeholder="发生了什么？说得越具体，处理越快" style="height: 96px; box-sizing: border-box; padding: 12px 14px; border-radius: 16px; border: 1px solid #D3DAE0; background: #FFFFFF; color: #15171C; font-family: inherit; font-size: 15px; line-height: 1.5; resize: none"></textarea>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 15px; font-weight: 800">截图证据（选填，最多 3 张）</div>
<button type="button" aria-label="添加截图" style="width: 76px; height: 76px; border-radius: 16px; border: 1px dashed #B8C0C7; background: #FFFFFF; color: #5B5F68; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 10px; min-height: 44px">
<input id="alsoblock" type="checkbox" style="flex-shrink: 0; width: 18px; height: 18px; margin: 0; accent-color: #193543">
<label for="alsoblock" style="font-size: 14px">同时拉黑对方，以后不会再撮合到一起</label>
</div>
</div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div style="padding: 90px 32px 0; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 999px; background: {{accent}}; color: #15171C; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"></path></svg></span>
<div style="font-size: 22px; font-weight: 800">举报已收到</div>
<div style="font-size: 15px; line-height: 1.6; color: #3D4048">我们会在 24 小时内处理，结果会用微信服务通知告诉你。谢谢你让这里更干净。</div>
</div>
</sc-if>
<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 20px 30px; background: #FFFFFF; border-top: 1px solid #E2E7EB">
<sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{submit}}" style="width: 100%; height: 56px; border-radius: 999px; border: 0; background: #193543; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">提交举报</button>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<a href="GroupInfo.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #193543; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">返回</a>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7CCAE3","options":["#7CCAE3","#C4B5FD","#D2F65A","#FDBA74"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const accent = this.props.accent ?? '#7CCAE3';
    const reason = s.reason || '';
    const reasons = ['骚扰或不当言行', '色情低俗', '推销 / 拉人头', '涉及金钱交易', '放鸽子 / 恶意爽约', '冒充身份', '其他'].map((r) => {
      const on = r === reason;
      return {
        label: r,
        bg: on ? accent : '#FFFFFF',
        bd: on ? accent : '#E2E7EB',
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ reason: r, warn: false })
      };
    });
    const done = !!s.done;
    const warn = !!s.warn && !reason;
    return {
      accent: accent,
      reasons: reasons,
      editing: !done,
      done: done,
      hint: warn ? '先选一个原因' : (reason ? '已选 1 项' : '选一个'),
      hintColor: warn ? '#B42318' : '#5B5F68',
      submit: () => {
        if (reason) {
          this.setState({ done: true });
        } else {
          this.setState({ warn: true });
        }
      }
    };
  }
}
</script>
</body>
</html>
