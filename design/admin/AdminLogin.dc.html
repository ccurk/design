<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>后台登录</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#000000}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 100vh; padding: 48px 16px; background: #F1F4F6; color: #15171C; font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', sans-serif; display: flex; align-items: center; justify-content: center">
<main style="width: 100%; max-width: 420px; box-sizing: border-box; padding: 40px clamp(20px, 6vw, 36px); border-radius: 28px; background: #FFFFFF; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; background: {{accent}}; color: #15171C; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900">搭</span>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 800">活动搭子</span><span style="font-size: 13px; color: #5B5F68">运营后台</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 26px; font-weight: 800">登录后台</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #5B5F68">只给运营同学使用。在这里确认撮合、处理举报、管理局和信用。</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pw" style="font-size: 13px; font-weight: 700; color: #5B5F68">后台密码</label>
<input id="pw" type="password" value="{{pw}}" onChange="{{onPw}}" placeholder="输入密码" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid {{pwBorder}}; background: #FFFFFF; color: #15171C; font-family: inherit; font-size: 16px">
<sc-if value="{{showErr}}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 0; font-size: 13px; color: #B42318">先输入密码</p>
</sc-if>
</div>
<sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
<a href="AdminDashboard.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 999px; background: #193543; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">进入后台</a>
</sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{tryLogin}}" style="height: 52px; border: 0; border-radius: 999px; background: #193543; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">进入后台</button>
</sc-if>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #6B6F78">忘了密码？请技术同学在服务器上重新设置。</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7CCAE3","options":["#7CCAE3","#C4B5FD","#D2F65A","#FDBA74"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const pw = s.pw || '';
    return {
      accent: this.props.accent ?? '#7CCAE3',
      pw: pw,
      onPw: (e) => this.setState({ pw: e.target.value, err: false }),
      ready: pw.length > 0,
      notReady: pw.length === 0,
      showErr: !!s.err,
      pwBorder: s.err ? '#B42318' : '#D3DAE0',
      tryLogin: () => this.setState({ err: true })
    };
  }
}
</script>
</body>
</html>
